<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الرقابة - كشف الحساب المستقل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .table-container { border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-slate-800">📊 كشف حساب التحويلات</h1>
                <p class="text-slate-500 text-sm mt-1">عرض وتفليتر عمليات انستا باي، المحافظ، والفيزا</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2">
                    📥 تصدير إكسيل
                </button>
                <button onclick="location.reload()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-xl font-bold">
                    🔄 تحديث
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-white p-6 rounded-2xl shadow-sm mb-6 border border-slate-200">
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500 mr-2">نوع العملية</label>
                <select id="typeFilter" class="w-full p-3 bg-slate-50 border-none rounded-xl font-bold outline-none ring-2 ring-transparent focus:ring-indigo-500 transition-all">
                    <option value="all">الكل</option>
                    <option value="insta">انستا باي</option>
                    <option value="wallet">محافظ إلكترونية</option>
                    <option value="visa">فيزا / ماكينة</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500 mr-2">الفرع</label>
                <select id="branchFilter" class="w-full p-3 bg-slate-50 border-none rounded-xl font-bold outline-none ring-2 ring-transparent focus:ring-indigo-500 transition-all">
                    <option value="all">كل الفروع</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500 mr-2">من تاريخ</label>
                <input type="date" id="dateFrom" class="w-full p-3 bg-slate-50 border-none rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500 mr-2">إلى تاريخ</label>
                <input type="date" id="dateTo" class="w-full p-3 bg-slate-50 border-none rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-4 mt-2">
                <button onclick="fetchData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-lg shadow-indigo-100 transition-all">
                    🔎 عـرض الـسـجـلات الآن
                </button>
            </div>
        </div>

        <div class="bg-white table-container border border-slate-200">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white">
                        <th class="p-4 border-b border-slate-700 text-center">التاريخ</th>
                        <th class="p-4 border-b border-slate-700 text-center">الفرع</th>
                        <th class="p-4 border-b border-slate-700 text-center">النوع</th>
                        <th class="p-4 border-b border-slate-700 text-center text-lg">المبلغ</th>
                        <th class="p-4 border-b border-slate-700 text-center font-mono text-sm">الرقم/الباتش</th>
                        <th class="p-4 border-b border-slate-700">التفاصيل</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="text-slate-700">
                    <tr>
                        <td colspan="6" class="p-20 text-center text-slate-400 italic">برجاء الضغط على "عرض السجلات" لبدء جلب البيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = { databaseURL: "https://sample-firebase-ai-app-e4260-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentData = [];

        // تحميل قائمة الفروع تلقائياً عند فتح الصفحة
        window.onload = function() {
            const branchSelect = document.getElementById('branchFilter');
            db.ref("branches").once("value").then(snap => {
                snap.forEach(child => {
                    let opt = document.createElement('option');
                    opt.value = child.key;
                    opt.text = child.val().name;
                    branchSelect.add(opt);
                });
            });
        };

        function fetchData() {
            const type = document.getElementById('typeFilter').value;
            const branch = document.getElementById('branchFilter').value;
            const from = document.getElementById('dateFrom').value;
            const to = document.getElementById('dateTo').value;
            const tbody = document.getElementById('dataTableBody');

            tbody.innerHTML = '<tr><td colspan="6" class="p-20 text-center text-indigo-600 font-bold animate-pulse text-xl">⏳ جاري الاتصال بقاعدة البيانات...</td></tr>';

            db.ref("treasury").once("value").then(snapshot => {
                currentData = [];
                snapshot.forEach(dayRecord => {
                    let data = dayRecord.val();
                    
                    // فلترة التاريخ
                    if(from && data.date < from) return;
                    if(to && data.date > to) return;
                    // فلترة الفرع
                    if(branch !== "all" && data.branchKey !== branch) return;

                    // تجميع البيانات الفرعية
                    processSubData(data, 'insta', 'انستا', type);
                    processSubData(data, 'wallet', 'محفظة', type);
                    processSubData(data, 'visa', 'فيزا', type);
                });

                renderTable();
            });
        }

        function processSubData(data, key, typeLabel, filterType) {
            if((filterType === 'all' || filterType === key) && data[key]) {
                data[key].forEach(item => {
                    currentData.push({
                        date: data.date,
                        branch: data.branchName,
                        type: typeLabel,
                        amount: parseFloat(item.amount) || 0,
                        reference: item.mobile || item.batch || "---",
                        details: item.name || item.calcDetails || "---"
                    });
                });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            currentData.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            tbody.innerHTML = "";
            if(currentData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-20 text-center text-red-500 font-bold">❌ لم يتم العثور على أي معاملات بهذه الفلاتر</td></tr>';
                return;
            }

            currentData.forEach(r => {
                tbody.innerHTML += `
                    <tr class="hover:bg-indigo-50/50 transition-colors border-b border-slate-100">
                        <td class="p-4 text-center font-bold text-slate-500">${r.date}</td>
                        <td class="p-4 text-center font-black text-slate-800">${r.branch}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-lg text-[10px] font-bold text-white ${r.type === 'فيزا' ? 'bg-blue-600' : 'bg-purple-600'}">${r.type}</span>
                        </td>
                        <td class="p-4 text-center font-black text-emerald-600 text-xl">${r.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        <td class="p-4 text-center font-mono text-xs text-slate-400">${r.reference}</td>
                        <td class="p-4 text-right text-xs font-bold text-slate-600 leading-relaxed">${r.details}</td>
                    </tr>`;
            });
        }

        function exportToExcel() {
            if(currentData.length === 0) return alert("لا توجد بيانات لتصديرها! قم بالعرض أولاً.");
            const ws = XLSX.utils.json_to_sheet(currentData.map(r => ({
                "التاريخ": r.date, "الفرع": r.branch, "النوع": r.type, "المبلغ": r.amount, "الرقم المرجي": r.reference, "التفاصيل": r.details
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Statement");
            XLSX.writeFile(wb, `Report_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
