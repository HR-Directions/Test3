<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف الحساب المطور - نظام الرقابة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .filter-card { transition: all 0.3s ease; }
        .hidden-filter { display: none; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 no-print">
            <div>
                <h1 class="text-3xl font-black text-indigo-900">📊 كشف الحساب الاحترافي</h1>
                <p class="text-slate-500 font-bold text-sm">نظام تتبع التحويلات (انستا - محافظ - فيزا)</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all">
                    📥 تصدير Excel
                </button>
                <button onclick="location.reload()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-6 py-3 rounded-2xl font-bold">
                    🔄 تحديث الصفحة
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-8 no-print">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-2">نوع العملية</label>
                    <select id="typeFilter" onchange="handleTypeChange()" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-indigo-500 transition-all">
                        <option value="all">الكل (شامل)</option>
                        <option value="insta">انستا باي (InstaPay)</option>
                        <option value="wallet">محفظة إلكترونية (Wallet)</option>
                        <option value="visa">فيزا / ماكينة (Visa)</option>
                    </select>
                </div>

                <div id="subFilterWrapper" class="hidden-filter animate-pulse">
                    <label id="subFilterLabel" class="block text-xs font-black text-indigo-500 mb-2 mr-2 italic">تحديد الحساب/الرقم</label>
                    <select id="subFilterSelect" class="w-full p-3.5 bg-indigo-50 border-2 border-indigo-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="all">الكل</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-2">الفرع</label>
                    <select id="branchFilter" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-indigo-500">
                        <option value="all">كل الفروع</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-2">من تاريخ</label>
                    <input type="date" id="dateFrom" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-2">إلى تاريخ</label>
                    <input type="date" id="dateTo" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-indigo-500">
                </div>
            </div>

            <button onclick="fetchFilteredData()" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-100 transition-all text-lg">
                🚀 عـرض الـنتـائج الـمفـلترة
            </button>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-slate-900 text-white">
                        <th class="p-5 border-l border-slate-800">التاريخ</th>
                        <th class="p-5 border-l border-slate-800">الفرع</th>
                        <th class="p-5 border-l border-slate-800">النوع</th>
                        <th class="p-5 border-l border-slate-800 text-xl">المبلغ</th>
                        <th class="p-5 border-l border-slate-800 font-mono">الرقم/الباتش</th>
                        <th class="p-5 text-right">البيان / الاسم</th>
                    </tr>
                </thead>
                <tbody id="resultsBody" class="text-slate-700">
                    <tr>
                        <td colspan="6" class="p-20 text-center text-slate-400 font-bold italic">قم باختيار الفلاتر ثم اضغط "عرض النتائج"</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://sample-firebase-ai-app-e4260-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allFetchedRecords = [];

        // تعبئة الفروع عند البداية
        window.onload = function() {
            db.ref("branches").once("value").then(s => {
                const bSelect = document.getElementById('branchFilter');
                s.forEach(c => { bSelect.innerHTML += `<option value="${c.key}">${c.val().name}</option>`; });
            });
        };

        // وظيفة التحكم في ظهور الفلتر الفرعي (الحساب أو الرقم)
        function handleTypeChange() {
            const type = document.getElementById('typeFilter').value;
            const wrapper = document.getElementById('subFilterWrapper');
            const label = document.getElementById('subFilterLabel');
            const subSelect = document.getElementById('subFilterSelect');

            if (type === 'insta' || type === 'wallet') {
                wrapper.classList.remove('hidden-filter');
                label.innerText = type === 'insta' ? 'إختر الحساب (الاسم)' : 'إختر رقم المحفظة';
                
                // جلب الخيارات الفرعية الفريدة من قاعدة البيانات
                subSelect.innerHTML = '<option value="all">جاري التحميل...</option>';
                db.ref("treasury").limitToLast(50).once("value").then(snap => {
                    let uniqueOptions = new Set();
                    snap.forEach(day => {
                        if (day.val()[type]) {
                            day.val()[type].forEach(item => {
                                let val = type === 'insta' ? (item.name || item.mobile) : item.mobile;
                                if(val) uniqueOptions.add(val);
                            });
                        }
                    });
                    subSelect.innerHTML = '<option value="all">الكل</option>';
                    uniqueOptions.forEach(opt => { subSelect.innerHTML += `<option value="${opt}">${opt}</option>`; });
                });
            } else {
                wrapper.classList.add('hidden-filter');
            }
        }

        function fetchFilteredData() {
            const type = document.getElementById('typeFilter').value;
            const subVal = document.getElementById('subFilterSelect').value;
            const branch = document.getElementById('branchFilter').value;
            const from = document.getElementById('dateFrom').value;
            const to = document.getElementById('dateTo').value;
            const tbody = document.getElementById('resultsBody');

            tbody.innerHTML = '<tr><td colspan="6" class="p-20 text-center font-bold text-indigo-600 animate-pulse">⏳ جاري جلب وتدقيق البيانات...</td></tr>';

            db.ref("treasury").once("value").then(snapshot => {
                allFetchedRecords = [];
                snapshot.forEach(daySnap => {
                    const dayData = daySnap.val();
                    
                    // فلاتر عامة (تاريخ وفرع)
                    if(from && dayData.date < from) return;
                    if(to && dayData.date > to) return;
                    if(branch !== "all" && dayData.branchKey !== branch) return;

                    // معالجة البيانات بناءً على النوع والفلتر الفرعي
                    if (type === 'all' || type === 'insta') process(dayData, 'insta', 'انستا', subVal);
                    if (type === 'all' || type === 'wallet') process(dayData, 'wallet', 'محفظة', subVal);
                    if (type === 'all' || type === 'visa') process(dayData, 'visa', 'فيزا', 'all');
                });

                renderTable();
            });
        }

        function process(day, key, label, subFilter) {
            if (day[key]) {
                day[key].forEach(item => {
                    let itemRef = key === 'insta' ? (item.name || item.mobile) : item.mobile;
                    
                    // تطبيق الفلتر الفرعي (الحساب أو الرقم)
                    if (subFilter !== 'all' && itemRef !== subFilter) return;

                    allFetchedRecords.push({
                        date: day.date,
                        branch: day.branchName,
                        type: label,
                        amount: parseFloat(item.amount) || 0,
                        ref: item.mobile || item.batch || "---",
                        desc: item.name || item.calcDetails || "---"
                    });
                });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('resultsBody');
            allFetchedRecords.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            tbody.innerHTML = "";
            if (allFetchedRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-20 text-center text-red-500 font-bold">❌ لا توجد سجلات مطابقة للبحث</td></tr>';
                return;
            }

            allFetchedRecords.forEach(r => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-50 hover:bg-indigo-50/30 transition-all">
                        <td class="p-4 border-l font-bold text-slate-500">${r.date}</td>
                        <td class="p-4 border-l font-black text-slate-800">${r.branch}</td>
                        <td class="p-4 border-l">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold text-white ${r.type==='فيزا'?'bg-blue-500':'bg-purple-600'}">${r.type}</span>
                        </td>
                        <td class="p-4 border-l font-black text-emerald-600 text-xl">${r.amount.toLocaleString()}</td>
                        <td class="p-4 border-l font-mono text-xs text-slate-400">${r.ref}</td>
                        <td class="p-4 text-right text-xs font-bold text-slate-600 leading-relaxed">${r.desc}</td>
                    </tr>`;
            });
        }

        function exportToExcel() {
            if(allFetchedRecords.length === 0) return alert("لا توجد بيانات لتصديرها");
            const ws = XLSX.utils.json_to_sheet(allFetchedRecords.map(r => ({
                "التاريخ": r.date, "الفرع": r.branch, "نوع العملية": r.type, "المبلغ": r.amount, "الرقم المرجعي": r.ref, "البيان": r.desc
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Statement");
            XLSX.writeFile(wb, `Report_${new Date().toLocaleDateString('ar-EG')}.xlsx`);
        }
    </script>
</body>
</html>
