<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف الحساب المطور - نظام الرقابة الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .hidden-filter { display: none; }
        .batch-badge { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-3xl font-black text-slate-800">📊 كشف الحساب التحليلي</h1>
                <p class="text-indigo-600 font-bold text-sm">دمج تلقائي للباتشات وتفصيل الحسابات</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-bold shadow-lg transition-all flex items-center gap-2">
                    📥 تصدير التقرير
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-1">نوع المعاملة</label>
                    <select id="typeFilter" onchange="updateDynamicFilters()" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-indigo-500">
                        <option value="all">كل الأنواع</option>
                        <option value="insta">انستا باي</option>
                        <option value="wallet">المحافظ</option>
                        <option value="visa">الفيزا (دمج الباتشات)</option>
                    </select>
                </div>

                <div id="subFilterWrapper" class="hidden-filter">
                    <label id="subLabel" class="block text-xs font-black text-indigo-500 mb-2 mr-1">تحديد الحساب</label>
                    <select id="subSelect" class="w-full p-3.5 bg-indigo-50 border-2 border-indigo-200 rounded-2xl font-bold outline-none">
                        <option value="all">تحميل...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-1">الفرع</label>
                    <select id="branchFilter" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none">
                        <option value="all">كل الفروع</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-1">من تاريخ</label>
                    <input type="date" id="dateFrom" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none">
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 mr-1">إلى تاريخ</label>
                    <input type="date" id="dateTo" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none">
                </div>
            </div>

            <button onclick="processData()" class="w-full mt-6 bg-slate-900 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl transition-all shadow-xl">
                🔎 تـحـديـث الـبـيـانـات
            </button>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs font-black uppercase tracking-widest">
                        <th class="p-5 border-b">التاريخ</th>
                        <th class="p-5 border-b">الفرع</th>
                        <th class="p-5 border-b">النوع</th>
                        <th class="p-5 border-b">المبلغ الإجمالي</th>
                        <th class="p-5 border-b">الرقم / الباتش</th>
                        <th class="p-5 border-b">عدد العمليات / البيان</th>
                    </tr>
                </thead>
                <tbody id="resultsBody" class="text-slate-700 font-bold">
                    <tr><td colspan="6" class="p-20 text-slate-300">انتظار طلب البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://sample-firebase-ai-app-e4260-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let finalReport = [];

        window.onload = () => {
            db.ref("branches").once("value").then(s => {
                const bSelect = document.getElementById('branchFilter');
                s.forEach(c => { bSelect.innerHTML += `<option value="${c.key}">${c.val().name}</option>`; });
            });
        };

        function updateDynamicFilters() {
            const type = document.getElementById('typeFilter').value;
            const wrapper = document.getElementById('subFilterWrapper');
            const subSelect = document.getElementById('subSelect');
            const label = document.getElementById('subLabel');

            if (type === 'insta' || type === 'wallet') {
                wrapper.classList.remove('hidden-filter');
                label.innerText = type === 'insta' ? 'الحساب المستهدف' : 'رقم المحفظة';
                
                db.ref("treasury").limitToLast(100).once("value").then(snap => {
                    let items = new Set();
                    snap.forEach(day => {
                        if(day.val()[type]) {
                            day.val()[type].forEach(entry => {
                                let val = type === 'insta' ? (entry.name || entry.mobile) : entry.mobile;
                                if(val) items.add(val);
                            });
                        }
                    });
                    subSelect.innerHTML = '<option value="all">الكل</option>';
                    items.forEach(i => subSelect.innerHTML += `<option value="${i}">${i}</option>`);
                });
            } else {
                wrapper.classList.add('hidden-filter');
            }
        }

        function processData() {
            const type = document.getElementById('typeFilter').value;
            const subVal = document.getElementById('subSelect').value;
            const branch = document.getElementById('branchFilter').value;
            const from = document.getElementById('dateFrom').value;
            const to = document.getElementById('dateTo').value;
            const tbody = document.getElementById('resultsBody');

            tbody.innerHTML = '<tr><td colspan="6" class="p-20 animate-pulse text-indigo-600 font-black">جاري المعالجة والدمج...</td></tr>';

            db.ref("treasury").once("value").then(snapshot => {
                finalReport = [];
                let visaBatches = {}; // لتجميع باتشات الفيزا

                snapshot.forEach(snap => {
                    const day = snap.val();
                    if((from && day.date < from) || (to && day.date > to)) return;
                    if(branch !== "all" && day.branchKey !== branch) return;

                    // معالجة انستا ومحافظ
                    ['insta', 'wallet'].forEach(k => {
                        if((type === 'all' || type === k) && day[k]) {
                            day[k].forEach(item => {
                                let identity = k === 'insta' ? (item.name || item.mobile) : item.mobile;
                                if(type !== 'all' && subVal !== 'all' && identity !== subVal) return;

                                finalReport.push({
                                    date: day.date, bName: day.branchName, 
                                    type: k === 'insta' ? 'انستا' : 'محفظة',
                                    amt: parseFloat(item.amount), ref: identity, desc: "عملية فردية"
                                });
                            });
                        }
                    });

                    // معالجة الفيزا (دمج الباتشات)
                    if((type === 'all' || type === 'visa') && day.visa) {
                        day.visa.forEach(v => {
                            let key = `${day.date}_${day.branchKey}_${v.batch}`;
                            if(!visaBatches[key]) {
                                visaBatches[key] = {
                                    date: day.date, bName: day.branchName, type: 'فيزا',
                                    amt: 0, ref: v.batch, count: 0
                                };
                            }
                            visaBatches[key].amt += parseFloat(v.amount);
                            visaBatches[key].count += (parseInt(v.count) || 1);
                        });
                    }
                });

                // تحويل الباتشات المدمجة إلى المصفوفة النهائية
                Object.values(visaBatches).forEach(b => {
                    finalReport.push({
                        date: b.date, bName: b.bName, type: b.type,
                        amt: b.amt, ref: `Batch: ${b.ref}`, desc: `إجمالي ${b.count} عمليات`
                    });
                });

                renderTable();
            });
        }

        function renderTable() {
            const tbody = document.getElementById('resultsBody');
            finalReport.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            tbody.innerHTML = "";
            if(finalReport.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-20 text-red-500 font-black">لا توجد سجلات مطابقة</td></tr>';
                return;
            }

            finalReport.forEach(r => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition-all">
                        <td class="p-5 font-bold text-slate-400">${r.date}</td>
                        <td class="p-5 font-black text-slate-800">${r.bName}</td>
                        <td class="p-5">
                            <span class="px-3 py-1 rounded-lg text-[10px] text-white ${r.type==='فيزا'?'bg-blue-600':r.type==='انستا'?'bg-purple-600':'bg-amber-600'}">${r.type}</span>
                        </td>
                        <td class="p-5 text-emerald-600 text-xl font-black">${r.amt.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        <td class="p-5 font-mono text-sm text-slate-500">${r.ref}</td>
                        <td class="p-5 text-right text-xs text-slate-400 font-bold">${r.desc}</td>
                    </tr>`;
            });
        }

        function exportToExcel() {
            if(finalReport.length === 0) return alert("لا توجد بيانات");
            const ws = XLSX.utils.json_to_sheet(finalReport.map(r => ({
                "التاريخ": r.date, "الفرع": r.bName, "النوع": r.type, "المبلغ": r.amt, "المرجع": r.ref, "البيان": r.desc
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "تقرير الرقابة");
            XLSX.writeFile(wb, `Audit_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
