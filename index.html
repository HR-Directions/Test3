<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الرقابة الاحترافي - الإصدار النهائي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .no-print { transition: all 0.2s; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .capture-area { background: #fff; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div id="visaModal" class="modal" onclick="this.style.display='none'">
        <div class="bg-white w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <div class="bg-indigo-600 p-4 text-white flex justify-between">
                <span class="font-bold">تفاصيل عمليات الباتش</span>
                <button onclick="document.getElementById('visaModal').style.display='none'">✕</button>
            </div>
            <div id="modalBody" class="p-4 max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="mainReportArea" class="max-w-6xl mx-auto bg-white p-4 md:p-8 rounded-3xl shadow-xl border border-slate-200">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-800">📊 كشف الحساب الموحد</h1>
                <p class="text-indigo-600 font-bold">نظام الرقابة والتدقيق المالي الذكي</p>
            </div>
            
            <div class="flex flex-wrap gap-2 no-print">
                <button onclick="exportToPDF()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                    📄 PDF
                </button>
                <button onclick="sendAsImage()" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                    🟢 واتساب (صورة)
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg">
                    📥 Excel
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-100 no-print">
            <div>
                <label class="block text-xs font-black text-slate-500 mb-2">نوع العملية</label>
                <select id="typeFilter" onchange="loadSubOptions()" class="w-full p-3 rounded-xl border-none ring-2 ring-slate-200 focus:ring-indigo-500 font-bold">
                    <option value="all">الكل</option>
                    <option value="insta">انستا باي</option>
                    <option value="wallet">محافظ</option>
                    <option value="visa">فيزا (دمج الباتشات)</option>
                </select>
            </div>
            <div id="subFilterBox" class="hidden">
                <label id="subLabel" class="block text-xs font-black text-indigo-500 mb-2 italic">الحساب / الرقم</label>
                <select id="subSelect" class="w-full p-3 rounded-xl ring-2 ring-indigo-200 font-bold"></select>
            </div>
            <div>
                <label class="block text-xs font-black text-slate-500 mb-2">من تاريخ</label>
                <input type="date" id="dateFrom" class="w-full p-2.5 rounded-xl ring-2 ring-slate-200">
            </div>
            <div>
                <label class="block text-xs font-black text-slate-500 mb-2">إلى تاريخ</label>
                <input type="date" id="dateTo" class="w-full p-2.5 rounded-xl ring-2 ring-slate-200">
            </div>
            <div class="md:col-span-4 mt-2">
                <button onclick="fetchAndProcess()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl hover:bg-indigo-700 transition-all">تحديث السجلات والبيانات</button>
            </div>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-100">
            <table id="reportTable" class="w-full text-center">
                <thead class="bg-slate-800 text-white text-xs">
                    <tr>
                        <th class="p-4 border-l border-slate-700">التاريخ</th>
                        <th class="p-4 border-l border-slate-700">الفرع</th>
                        <th class="p-4 border-l border-slate-700">النوع</th>
                        <th class="p-4 border-l border-slate-700 text-lg">المبلغ</th>
                        <th class="p-4 border-l border-slate-700">المرجع (الاسم | الرقم)</th>
                        <th class="p-4 border-l border-slate-700">البيان</th>
                        <th class="p-4 no-print">تفاصيل</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-sm font-bold text-slate-700">
                    <tr><td colspan="7" class="p-20 text-slate-300 italic">بانتظار طلب البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://sample-firebase-ai-app-e4260-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentData = [];
        let visaDetails = {};

        // وظيفة الفلتر الفرعي
        async function loadSubOptions() {
            const type = document.getElementById('typeFilter').value;
            const box = document.getElementById('subFilterBox');
            const select = document.getElementById('subSelect');
            
            if (type === 'all' || type === 'visa') { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            
            const snap = await db.ref("treasury").limitToLast(50).once("value");
            let set = new Set();
            snap.forEach(d => {
                if(d.val()[type]) d.val()[type].forEach(i => set.add(type === 'insta' ? `${i.name} | ${i.mobile}` : i.mobile));
            });
            select.innerHTML = '<option value="all">الكل</option>';
            set.forEach(val => select.innerHTML += `<option value="${val}">${val}</option>`);
        }

        // معالجة البيانات
        async function fetchAndProcess() {
            const type = document.getElementById('typeFilter').value;
            const sub = document.getElementById('subSelect').value;
            const from = document.getElementById('dateFrom').value;
            const to = document.getElementById('dateTo').value;
            
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="p-20 animate-pulse text-indigo-600 font-black">جاري التحقق والدمج...</td></tr>';

            const snap = await db.ref("treasury").once("value");
            currentData = [];
            visaDetails = {};
            let visaGroups = {};

            snap.forEach(daySnap => {
                const day = daySnap.val();
                if((from && day.date < from) || (to && day.date > to)) return;

                ['insta', 'wallet'].forEach(k => {
                    if((type === 'all' || type === k) && day[k]) {
                        day[k].forEach(item => {
                            let identity = k === 'insta' ? `${item.name} | ${item.mobile}` : item.mobile;
                            if(type !== 'all' && sub !== 'all' && identity !== sub) return;
                            currentData.push({ date: day.date, branch: day.branchName, type: k==='insta'?'انستا':'محفظة', amt: parseFloat(item.amount), ref: identity, desc: "عملية فردية", isVisa: false });
                        });
                    }
                });

                if((type === 'all' || type === 'visa') && day.visa) {
                    day.visa.forEach(v => {
                        let key = `${day.date}_${day.branchKey}_${v.batch}`;
                        if(!visaGroups[key]) {
                            visaGroups[key] = { date: day.date, branch: day.branchName, type: 'فيزا', amt: 0, ref: `Batch: ${v.batch}`, count: 0, isVisa: true, key: key };
                            visaDetails[key] = [];
                        }
                        visaGroups[key].amt += parseFloat(v.amount);
                        visaGroups[key].count += (parseInt(v.count) || 1);
                        visaDetails[key].push(v);
                    });
                }
            });

            Object.values(visaGroups).forEach(g => currentData.push({...g, desc: `دمج ${g.count} عمليات`}));
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            currentData.sort((a,b) => new Date(b.date) - new Date(a.date));
            tbody.innerHTML = currentData.length === 0 ? '<tr><td colspan="7" class="p-10 text-red-500">لا توجد بيانات</td></tr>' : "";
            
            currentData.forEach(r => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="p-4 text-xs text-slate-400">${r.date}</td>
                        <td class="p-4">${r.branch}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-[10px] text-white ${r.type==='فيزا'?'bg-blue-600':'bg-purple-600'}">${r.type}</span></td>
                        <td class="p-4 text-emerald-600 text-lg font-black">${r.amt.toLocaleString()}</td>
                        <td class="p-4 font-mono text-xs text-slate-500">${r.ref}</td>
                        <td class="p-4 text-xs text-slate-400">${r.desc}</td>
                        <td class="p-4 no-print">${r.isVisa ? `<button onclick="showDetails('${r.key}')" class="text-indigo-600 underline">👁️</button>` : '-'}</td>
                    </tr>`;
            });
        }

        function showDetails(key) {
            let html = '<table class="w-full text-center border"><thead><tr class="bg-slate-100 italic"><th>المبلغ</th><th>التفاصيل</th></tr></thead><tbody>';
            visaDetails[key].forEach(d => html += `<tr class="border-b"><td>${d.amount}</td><td class="text-xs">${d.calcDetails || '-'}</td></tr>`);
            document.getElementById('modalBody').innerHTML = html + '</tbody></table>';
            document.getElementById('visaModal').style.display = 'flex';
        }

        // تصدير PDF احترافي يدعم العربية
        async function exportToPDF() {
            const btn = document.querySelectorAll('.no-print');
            btn.forEach(b => b.style.display = 'none');
            
            const canvas = await html2canvas(document.getElementById('mainReportArea'), { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const width = pdf.internal.pageSize.getWidth();
            const height = (canvas.height * width) / canvas.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, width, height);
            pdf.save("تقرير_الرقابة.pdf");
            btn.forEach(b => b.style.display = 'flex');
        }

        // إرسال صورة للواتساب (تحويل ونسخ)
        async function sendAsImage() {
            const btn = document.querySelectorAll('.no-print');
            btn.forEach(b => b.style.display = 'none');
            
            const canvas = await html2canvas(document.getElementById('mainReportArea'), { scale: 2 });
            canvas.toBlob(async (blob) => {
                const item = new ClipboardItem({ "image/png": blob });
                await navigator.clipboard.write([item]);
                alert("✅ تم تحويل التقرير لصورة ونسخها بنجاح!\nافتح الواتساب الآن وقم بعمل 'Paste' (لصق) للصورة.");
                window.open("https://web.whatsapp.com/", "_blank");
                btn.forEach(b => b.style.display = 'flex');
            });
        }

        function exportToExcel() {
            const ws = XLSX.utils.json_to_sheet(currentData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report");
            XLSX.writeFile(wb, "Report.xlsx");
        }
    </script>
</body>
</html>
